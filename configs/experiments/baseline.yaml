# Benchmark: BrowseComp reference plugin (see docs/ADDING_A_BENCHMARK.md for your own).
# Baseline: Haiku 5.5 direct tool-calling agent, live web, full delivery, 3 repeats -> pass@k / pass^k.
campaign_id: baseline_haiku55
benchmark: {id: browsecomp, num_examples: 13, seed: 0}
grader: {provider: anthropic, model: claude-haiku-5-5, effort: low}
repeats: 3
concurrency: 8
max_cost_usd: 150.0
defaults:
  model: {provider: anthropic, name: claude-haiku-5-5, effort: medium, max_tokens: 16000, thinking_display: summarized}
  harness: direct_tool
  condition: search_fetch
  delivery: full
  search_backend: exa
  limits: {step_cap: 50, token_budget_per_task: 1500000, time_cap_s: 1200, cost_cap_usd: 1.0}
